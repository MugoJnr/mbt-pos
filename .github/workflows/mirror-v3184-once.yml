# One push of cursor/mirror-v3184-ca82 copies the existing v3.1.84
# installer onto MugoJnr/mbt-pos-releases. workflow_dispatch on main
# is the normal path; this branch run exists because the cloud token
# cannot call the Actions dispatch API.

name: Mirror existing v3.1.84 installer

on:
  push:
    branches:
      - cursor/mirror-v3184-ca82

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Copy v3.1.84 installer and checksum
        env:
          RELEASES_REPO_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v3.1.84
          SOURCE_REPO: MugoJnr/mbt-pos
        run: python scripts/mirror_release_to_public.py
