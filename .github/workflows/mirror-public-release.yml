name: Mirror installer to public releases repo

# GitHub only starts release workflows that exist on the default branch.
# This file must be on main, even when the installer is tagged from
# port/v3.1.66-audit. Checkout then uses the tagged commit.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to mirror, for example v3.1.84
        required: true
        type: string

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    concurrency:
      group: mirror-public-${{ github.event.release.tag_name || inputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Mirror installer, checksum, and notes
        env:
          RELEASES_REPO_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          SOURCE_REPO: ${{ github.repository }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease && 'true' || 'false' }}
        run: python scripts/mirror_release_to_public.py
